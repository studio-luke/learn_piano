<!doctype html>
<!-- ===== 랜덤 코드 연습 (코드 트레이너) — 주소 /trainer/chords/ =====
     화면 구성: 머리글(공통) · 연습 카드(코드, 건반, 버튼) · 출제 설정 · 바닥글(공통)
     머리글·바닥글·왼쪽 메뉴는 assets/js/common/layout.js, 동작은 assets/js/pages/practice.js에서 시작해요.
     (경로가 ../../로 시작하는 건 이 파일이 사이트 맨 위에서 두 폴더 안에 있어서)
     data-i18n="키"가 붙은 요소의 글자는 현재 언어 문구로 바뀌어요 (assets/js/i18n/). 여기 적힌 한국어는 JS가 늦게 뜰 때 잠깐 보이는 기본값. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="수업에서 배운 코드를 2옥타브 건반으로 복습하는 화성학 코드 트레이너. 3화음, 7화음, 텐션 코드, 7alt까지 랜덤 출제와 자리바꿈 허용 채점.">
<title>코드 트레이너 · ChordOven</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#F5ECDD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1612" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Music&display=swap">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/account.css">
<link rel="stylesheet" href="/assets/css/practice.css">
<script type="module" src="/assets/js/pages/practice.js"></script>
</head>
<body>
<div class="app">
  <header class="top" id="siteHeader"></header>

  <main class="layout">
    <!-- 연습 카드 -->
    <section class="desk" aria-label="연습" data-i18n-aria="deskAria">
    <!-- 오른쪽 위: 타이머 버튼과 도움말(?) — 폰 가로에서는 아래 옵션 줄 오른쪽 -->
      <div class="desk-tools">
        <button class="timer-btn" id="timerBtn" type="button" aria-pressed="false"><span aria-hidden="true">⏱</span><span class="timer-short" data-i18n="timerShort">타이머</span><span class="btn-time" id="timerBtnTime"></span><span class="timer-label" id="timerBtnLabel" data-i18n="timerStart">타이머 켜기</span></button>
        <span class="help" id="timerHelpWrap">
          <button class="help-btn" id="timerHelpBtn" type="button" aria-expanded="false" aria-controls="timerHelp" aria-label="타이머 도움말" data-i18n-aria="timerHelpLabel">?</button>
          <span class="help-pop" id="timerHelp" role="tooltip" data-i18n="timerHelp"></span>
        </span>
      </div>
      <div class="prompt">
        <!-- 틀린 문제 다시 풀기 중일 때만 보임 -->
        <div class="review-bar" id="reviewBar" hidden><span id="reviewText"></span><button class="linkbtn" id="reviewStop" type="button" data-i18n="reviewStop">그만하기</button></div>
        <div class="eyebrow"><span data-i18n="eyebrow">이 코드를 건반에서 눌러보세요</span><span class="timer" id="timerText" hidden></span></div>
        <div class="symbol" id="symbol" aria-live="polite"></div>
        <div class="hint" id="hint"></div>
        <div class="feedback" id="feedback" role="status"></div>
      </div>

      <div class="kb-wrap">
        <div class="kb-bar">
          <div class="selline"><span data-i18n="selected">선택한 음</span>: <output id="selNotes"></output></div>
          <div class="mini">
            <button class="mini-btn" id="btnPlaySel" title="눌린 건반 재생 (Space)" data-i18n="playHTML" data-i18n-title="playTitle">▶ 재생</button>
            <button class="mini-btn" id="btnClear" title="지우기 (Esc)" data-i18n="clear" data-i18n-title="clearTitle">지우기</button>
          </div>
        </div>
        <!-- 건반은 assets/js/practice/keyboard.js가 그림 -->
        <div class="keyboard" id="keyboard" aria-label="피아노 건반 (C3–C5)" data-i18n-aria="kbAria"></div>
        <div class="legend">
          <span><i class="dot" style="background: var(--accent)"></i><span data-i18n="legendMine">내가 누른 음</span></span>
          <span><i class="dot" style="background: var(--ok)"></i><span data-i18n="legendAns">정답 음</span></span>
        </div>
        <p class="rotate-tip" id="rotateTip" hidden><span data-i18n="rotateTip">폰을 가로로 돌리면 건반이 커져요.</span> <button class="linkbtn" id="rotateTipClose" type="button" data-i18n="close">닫기</button></p>
      </div>

      <div class="actions">
        <!-- 폰 세로 첫 방문 안내: 출제 설정이 아래에 있다는 걸 알려주는 떠 있는 알약 (채점 버튼 줄 바로 위, 누르면 출제 설정으로 스크롤, 오른쪽 ×는 닫기).
             출제 설정이 한 번 화면에 들어오면 이 기기에서는 다시 안 나옴 (pages/practice.js) -->
        <div class="scroll-tip" id="scrollTip" hidden><button class="scroll-tip-go" id="scrollTipGo" type="button"><span class="scroll-tip-arrow" aria-hidden="true">▼</span><span data-i18n="scrollTip">아래로 내리면 출제할 코드를 고를 수 있어요</span></button><button class="scroll-tip-x" id="scrollTipX" type="button" aria-label="닫기" data-i18n-aria="close">×</button></div>
        <button class="btn primary" id="btnCheck"><span data-i18n="check">제출</span><kbd>Enter</kbd></button>
        <button class="btn" id="btnReveal"><span data-i18n="reveal">정답 확인</span><kbd>G</kbd></button>
        <button class="btn next" id="btnNext"><span data-i18n="next">다음 문제 →</span><kbd>N</kbd></button>
      </div>

      <div class="small-toggles">
        <label class="check"><input type="checkbox" id="optLabels"> <span data-i18n="showLabels">건반에 음이름 표시</span></label>
        <label class="check"><input type="checkbox" id="optSound" checked> <span data-i18n="sound">건반 누를 때 소리</span></label>
        <label class="check pc-only"><input type="checkbox" id="optKbd"> <span data-i18n="kbdInput">키보드로 건반 입력</span></label>
        <!-- MIDI 입력 모드: 88건반 표시 (컴퓨터에서만). 연결 상태·지원 안 하는 브라우저 안내는 #midiStatus (pages/practice.js) -->
        <label class="check pc-only" id="midiOpt"><input type="checkbox" id="optMidi"> <span data-i18n="midiMode">MIDI 입력 모드</span><small class="midi-status" id="midiStatus"></small></label>
      </div>
    </section>

    <!-- 출제 설정 (코드 종류 칩은 assets/js/practice/settings.js가 그림) -->
    <aside class="sheet" aria-label="출제 설정" data-i18n-aria="settings">
      <!-- 제목 줄: 오른쪽에 출제 설정 공유 링크 버튼(관리자에게만 보임, common/share-settings.js) — 잠겨 있어도 누를 수 있음 -->
      <div class="sheet-head"><h2 data-i18n="settings">출제 설정</h2><button class="linkbtn preset-btn" id="presetBtn" type="button" hidden data-i18n="presetMake">🔗 이 설정으로 링크 만들기</button></div>
      <p class="lock-note" id="lockNote" hidden></p>
      <button class="sheet-lock" id="sheetLock" type="button" hidden tabindex="-1" aria-hidden="true"></button>

      <div id="typeGroups" class="group" style="gap: 16px"></div>

      <hr class="divider">

      <div class="opt">
        <h3 data-i18n="rangeH">출제 범위</h3>
        <label class="check"><input type="checkbox" id="optB"><span><span data-i18n="optB">특정 베이스의 코드만 출제</span><small data-i18n="optBsub"></small></span></label>
        <div class="sub" id="basesBox" hidden>
          <div class="bases" id="bases"></div>
          <div><button class="white-btn" id="basesWhite" type="button" aria-pressed="false" data-i18n="whiteKeys">흰 건반</button><button class="linkbtn" id="basesAll" type="button" data-i18n="selectAll">모두 선택</button><button class="linkbtn" id="basesNone" type="button" data-i18n="selectNone">모두 해제</button></div>
        </div>
        <label class="check"><input type="checkbox" id="optC"><span><span data-i18n="optC">세븐코드에 텐션 추가 허용</span><small data-i18n="optCsub"></small></span></label>
        <div class="sub" id="cBox" hidden>
          <div class="chips radios" role="radiogroup" aria-label="텐션 개수" data-i18n-aria="tensionCount">
            <label class="chip"><input type="radio" name="cMax" id="cMax1" value="1" checked><span data-i18n="max1">최대 1개</span></label>
            <label class="chip"><input type="radio" name="cMax" id="cMax2" value="2"><span data-i18n="max2">최대 2개</span></label>
          </div>
          <p class="note" data-i18n="cNote"></p>
        </div>
      </div>

      <button class="adv-toggle" id="advToggle" aria-expanded="false" aria-controls="advBox"><span data-i18n="adv">[심화] 입시 대비 표기 옵션</span><span class="chev" aria-hidden="true">▾</span></button>
      <div class="adv" id="advBox" hidden>
        <label class="check"><input type="checkbox" id="optD"><span><span data-i18n="optD"></span><small data-i18n="optDsub"></small></span></label>
        <label class="check"><input type="checkbox" id="optE"><span><span data-i18n="optE"></span><small data-i18n="optEsub"></small></span></label>
      </div>

      <p class="warnbox" id="settingsWarn"></p>
    </aside>
  </main>

  <footer class="contact" id="siteFooter"></footer>
</div>
</body>
</html>

<!doctype html>
<!-- ===== 홈 (사이트 첫 화면) — 주소 / =====
     소개 한 단락, [랜덤 코드 연습 시작] 버튼, 학습 메뉴 카드. 카드 목록은 assets/js/common/sitemap.js에서 와요
     (새 학습 기능을 만들면 sitemap.js만 고치면 홈과 왼쪽 메뉴에 함께 나타남).
     머리글·바닥글·메뉴는 assets/js/common/layout.js, 이 페이지 동작은 assets/js/pages/home.js. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ChordOven — 수업에서 배운 코드를 건반으로 복습하는 음악 학습 플랫폼. 랜덤 코드 연습(3화음, 7화음, 텐션 코드, 7alt), 연습 기록과 통계.">
<title>ChordOven</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F5ECDD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1612" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Music&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/account.css">
<link rel="stylesheet" href="assets/css/home.css">
<script type="module" src="assets/js/pages/home.js"></script>
</head>
<body>
<div class="app">
  <header class="top" id="siteHeader"></header>

  <main class="home">
    <!-- 소개 -->
    <section class="hero">
      <img class="hero-logo" src="favicon.svg" alt="">
      <h2 class="hero-title" data-i18n="homeHero">연습으로 음악을 완성해요</h2>
      <p class="hero-lead" data-i18n="homeLead"></p>
      <div class="hero-actions">
        <a class="btn primary hero-start" id="homeStart" href="trainer/chords/" data-i18n="homeStart">랜덤 코드 연습 시작</a>
        <a class="linkbtn hero-my" id="homeMy" href="mypage" data-i18n="homeMy" hidden></a>
      </div>
    </section>

    <!-- 학습 메뉴 카드 (assets/js/pages/home.js가 sitemap.js로 그림) -->
    <section class="home-menu" aria-labelledby="homeMenuH">
      <h3 id="homeMenuH" data-i18n="homeMenuH">학습 메뉴</h3>
      <div class="cards" id="homeCards"></div>
    </section>
  </main>

  <footer class="contact" id="siteFooter"></footer>
</div>
</body>
</html>
